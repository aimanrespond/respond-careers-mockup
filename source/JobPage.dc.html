      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="jp-first" style="font-size: 13px; font-weight: 500; color: #5B6470;">First name</label>
        <input id="jp-first" type="text" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D5D9DF; border-radius: 8px; font-family: Inter, system-ui, sans-serif; font-size: 15px; color: #121213; background: #ffffff;">

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="jp-resume" style="font-size: 13px; font-weight: 500; color: #5B6470;">Resume (PDF)</label>
