<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #000000; color: #ffffff; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1B70FF; } a:hover { color: #4D8DFF; }
    .role:hover { background: rgba(27,112,255,0.10); border-color: #1B70FF !important; }
    a:focus-visible, button:focus-visible { outline: 2px solid #1B70FF; outline-offset: 2px; }
  </style>
</helmet>
<div style="width: 1280px; height: 3080px; box-sizing: border-box; display: flex; flex-direction: column; background: #000000; color: #ffffff;">

  <header style="flex-shrink: 0; height: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; border-bottom: 1px solid rgba(255,255,255,0.08);">
    <div style="display: flex; align-items: center; gap: 40px;">
      <a href="https://respond.io" style="text-decoration: none; color: #ffffff; font-size: 20px; font-weight: 700; letter-spacing: -0.4px;">respond.io</a>
      <nav style="display: flex; gap: 28px; font-size: 15px; font-weight: 500; color: #ffffff;">
        <span>Product</span><span>Industries</span><span>Resources</span><span>Pricing</span><span>Why Us</span>
      </nav>
    </div>
    <div style="display: flex; gap: 12px;">
      <a href="https://respond.io" style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.35); color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 500;">Contact Us</a>
      <a href="https://app.respond.io" style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; background: #1B70FF; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 500;">Login</a>
    </div>
  </header>

  <section style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 88px 40px 48px; text-align: center; background: radial-gradient(60% 90% at 50% 0%, rgba(27,112,255,0.38), rgba(0,0,0,0) 70%);">
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; color: #CDCDCF; text-decoration: none; font-size: 14px; font-weight: 500; line-height: 20px;">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#CDCDCF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10H4"></path><path d="M9 5l-5 5 5 5"></path></svg>
      Careers
    </a>
    <h1 style="margin: 0; font-size: 48px; font-weight: 600; line-height: 60px; letter-spacing: -0.96px; color: #ffffff;">Open roles</h1>
    <p style="margin: 0; max-width: 640px; font-size: 18px; line-height: 28px; font-weight: 500; color: #ffffff;">{{total}} open roles. Click a role to read the full description and apply.</p>
  </section>

  <section style="display: flex; flex-direction: column; align-items: center; gap: 32px; padding: 0 40px 104px;">
    <div role="group" aria-label="Filter roles by team" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 1024px; max-width: 100%;">
      <sc-for list="{{pills}}" as="p" hint-placeholder-count="4">
        <button type="button" style="{{p.style}}" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}">{{p.label}}</button>
      </sc-for>
    </div>
    <div aria-live="polite" style="width: 1024px; max-width: 100%; display: flex; flex-direction: column; gap: 36px;">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: baseline; gap: 12px; padding: 0 4px;">
            <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #F8F9FA;">{{g.name}}</div>
            <div style="font-size: 13px; color: #CDCDCF;">{{g.countLabel}}</div>
          </div>
          <sc-for list="{{g.roles}}" as="r" hint-placeholder-count="2">
            <a href="{{r.href}}" class="role" style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 28px; border: 1px solid #003CA0; border-radius: 20px; text-decoration: none; color: #ffffff;">
              <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
                <div style="font-size: 18px; font-weight: 600; line-height: 24px; color: #ffffff;">{{r.title}}</div>
                <div style="font-size: 14px; line-height: 20px; font-weight: 400; color: #CDCDCF;">{{r.meta}}</div>
              </div>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M4 10h12"></path><path d="M11 5l5 5-5 5"></path></svg>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </section>

  <div style="margin-top: auto; flex-shrink: 0; height: 160px; box-sizing: border-box; margin-left: 40px; margin-right: 40px; margin-bottom: 40px; border-radius: 20px; background: #0B0F14; border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; font-size: 13px; color: #CDCDCF; letter-spacing: 0.06em; text-transform: uppercase;">Site footer — unchanged</div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":3080}}'>
const ROLES = [
  { t: 'Account Executive (EU)', d: 'Sales', l: 'Portugal · Remote' },
  { t: 'Account Executive (LATAM)', d: 'Sales', l: 'Brazil · Remote' },
  { t: 'Account Manager (APAC)', d: 'Sales', l: 'Kuala Lumpur · Remote' },
  { t: 'Account Manager (LATAM)', d: 'Sales', l: 'Brazil · Remote' },
  { t: 'Account Manager (MENA)', d: 'Sales', l: 'Portugal · Remote' },
  { t: 'Business Development Representative (EU)', d: 'Sales', l: 'Portugal · Remote' },
  { t: 'Partnerships Manager (LATAM)', d: 'Sales', l: 'Brazil · Remote' },
  { t: 'Technical Customer Support (APAC)', d: 'Support', l: 'Kuala Lumpur · Remote' },
  { t: 'Technical Customer Support (EMEA)', d: 'Support', l: 'Egypt · Remote' },
  { t: 'Technical Customer Support (LATAM)', d: 'Support', l: 'Brazil · Remote' },
  { t: 'Customer Success Manager (LATAM)', d: 'Customer Success', l: 'Brazil · Remote' },
  { t: 'Customer Experience Program Manager Associate', d: 'Customer Experience', l: 'Kuala Lumpur' },
  { t: 'Product Manager (AI)', d: 'Product', l: 'Kuala Lumpur' },
  { t: 'Application Security Engineer', d: 'Backend', l: 'Kuala Lumpur' },
  { t: 'Senior DevOps Engineer', d: 'Backend', l: 'Kuala Lumpur' },
  { t: 'Senior Mobile Developer', d: 'Frontend', l: 'Kuala Lumpur' },
  { t: 'Creative Technologist', d: 'Marketing', l: 'Kuala Lumpur' },
  { t: 'Senior Content Writer (CRO)', d: 'Marketing', l: 'Kuala Lumpur' },
  { t: 'Senior Frontend Developer', d: 'Other', l: 'Kuala Lumpur' },
  { t: 'Learning & Development Specialist', d: 'Other', l: 'Kuala Lumpur' }
];
const PREFERRED = ['Sales', 'Support', 'Customer Success', 'Customer Experience', 'Product', 'Backend', 'Frontend', 'Marketing'];
const PILL_BASE = 'appearance: none; cursor: pointer; height: 38px; padding: 0 16px; border-radius: 8px; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500; line-height: 1;';
const PILL_ON = PILL_BASE + ' border: 1px solid #1B70FF; background: #1B70FF; color: #ffffff;';
const PILL_OFF = PILL_BASE + ' border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #ffffff;';

function departments() {
  const seen = ROLES.map((r) => r.d).filter((d, i, a) => a.indexOf(d) === i);
  const ordered = PREFERRED.filter((d) => seen.indexOf(d) !== -1);
  const extra = seen.filter((d) => PREFERRED.indexOf(d) === -1 && d !== 'Other');
  const list = ordered.concat(extra);
  if (seen.indexOf('Other') !== -1) list.push('Other');
  return list;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'All' };
  }
  renderVals() {
    const sel = (this.state && this.state.sel) || 'All';
    const depts = departments();
    const counts = {};
    ROLES.forEach((r) => { counts[r.d] = (counts[r.d] || 0) + 1; });
    const pills = ['All'].concat(depts).map((name) => {
      const count = name === 'All' ? ROLES.length : counts[name];
      return {
        name: name,
        label: name + ' · ' + count,
        style: name === sel ? PILL_ON : PILL_OFF,
        pressed: name === sel ? 'true' : 'false',
        pick: () => this.setState({ sel: name })
      };
    });
    const groups = depts.filter((d) => sel === 'All' || d === sel).map((d) => ({
      name: d,
      countLabel: counts[d] + (counts[d] === 1 ? ' open role' : ' open roles'),
      roles: ROLES.filter((r) => r.d === d).map((r) => ({
        title: r.t,
        meta: r.l + ' · Full-time',
        href: 'JobPage.dc.html'
      }))
    }));
    return { pills: pills, groups: groups, total: ROLES.length };
  }
}
</script>
</body>
</html>
