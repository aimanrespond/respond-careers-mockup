<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 2 · Open roles — phone</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #000000; color: #ffffff; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #1B70FF; } a:hover { color: #4D8DFF; }
    .role:hover { background: rgba(27,112,255,0.10); border-color: #1B70FF !important; }
    a:focus-visible, button:focus-visible { outline: 2px solid #1B70FF; outline-offset: 2px; }
    .strip { scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); }
    .strip::-webkit-scrollbar { display: none; }
  </style>
  <style>
    .screen > header nav { flex-wrap: wrap; }
    html.embed .proto-bar { display: none; }
    html.embed, html.embed body { overflow: hidden; scrollbar-width: none; }
    html.embed::-webkit-scrollbar, html.embed body::-webkit-scrollbar { display: none; }
    html { background: #050608; } @media (min-width: 480px) { .screen { min-height: calc(100vh - 48px); margin: 24px auto; border: 1px solid rgba(255,255,255,0.12); border-radius: 28px; overflow: hidden; } }</style>
  <script>if (location.search.indexOf('embed') > -1) document.documentElement.className += ' embed';</script>
</head>
<body>
<div class="screen" style="width: 100%; max-width: 390px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; background: #000000; color: #ffffff;">

  <header style="flex-shrink: 0; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.08);">
    <a href="https://respond.io" style="text-decoration: none; color: #ffffff; font-size: 18px; font-weight: 700; letter-spacing: -0.4px;">respond.io</a>
    <button type="button" aria-label="Menu" style="appearance: none; background: none; border: 0; padding: 8px; margin: -8px; cursor: pointer; display: inline-flex;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>

  <section style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 40px 20px 28px; text-align: center; background: radial-gradient(90% 80% at 50% 0%, rgba(27,112,255,0.38), rgba(0,0,0,0) 70%);">
    <a href="careers.html" style="display: inline-flex; align-items: center; gap: 8px; color: #CDCDCF; text-decoration: none; font-size: 14px; font-weight: 500; line-height: 20px;">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#CDCDCF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10H4"></path><path d="M9 5l-5 5 5 5"></path></svg>
      Careers
    </a>
    <h1 style="margin: 0; font-size: 36px; font-weight: 600; line-height: 40px; letter-spacing: -0.72px; color: #ffffff;">Open roles</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; color: #ffffff;"><span data-total>20</span> open roles. Tap a role to read the full description and apply.</p>
  </section>

  <section style="display: flex; flex-direction: column; gap: 20px; padding: 0 20px 64px;">
    <div role="group" aria-label="Filter roles by team" class="strip" style="display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; margin: 0 -20px; padding: 0 20px;" data-loop="0"></div>
    <div aria-live="polite" style="display: flex; flex-direction: column; gap: 28px;" data-loop="2"></div>
  </section>

  <div style="margin-top: auto; flex-shrink: 0; height: 120px; box-sizing: border-box; margin-left: 20px; margin-right: 20px; margin-bottom: 20px; border-radius: 16px; background: #0B0F14; border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #CDCDCF; letter-spacing: 0.06em; text-transform: uppercase;">Site footer — unchanged</div>

</div>

<!-- Prototype bar: not part of the design. Shows which real URL this screen stands for. -->
<div class="proto-bar" role="note" aria-label="Prototype note">
  <a class="proto-home" href="index.html">All screens</a>
  <span class="proto-sep"></span>
  <strong>Step 2 · phone</strong>
  <span class="proto-url">respond.io/careers/open-roles</span>
  <span class="proto-note">Same page at phone width. Filter strip scrolls sideways.</span>
</div>
<style>
  .proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 9999; max-width: calc(100% - 32px); box-sizing: border-box;
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: rgba(20,22,26,0.92); color: #fff; border: 1px solid rgba(255,255,255,0.14);
    font: 500 13px/18px Inter, system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 8px 30px rgba(0,0,0,0.35); backdrop-filter: blur(10px); }
  .proto-bar a.proto-home { color: #fff; text-decoration: none; padding: 4px 8px; margin: -4px 0; border-radius: 6px; border: 1px solid rgba(255,255,255,0.35); white-space: nowrap; }
  .proto-bar a.proto-home:hover { background: rgba(255,255,255,0.10); color: #fff; }
  .proto-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.22); }
  .proto-url { color: #9FC2FF; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: nowrap; }
  .proto-bar strong { white-space: nowrap; }
  .proto-note { color: #CDCDCF; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }
  @media (max-width: 1100px) { .proto-note { display: none; } }
  @media (max-width: 560px) { .proto-sep, .proto-url { display: none; } .proto-bar { gap: 8px; } }
</style>

<script>
(function () {
const ROLES = [
  { t: 'Account Executive (EU)', d: 'Sales', l: 'Portugal · Remote' },
  { t: 'Account Executive (LATAM)', d: 'Sales', l: 'Brazil · Remote' },
  { t: 'Account Manager (APAC)', d: 'Sales', l: 'Kuala Lumpur · Remote' },
  { t: 'Account Manager (LATAM)', d: 'Sales', l: 'Brazil · Remote' },
  { t: 'Account Manager (MENA)', d: 'Sales', l: 'Portugal · Remote' },
  { t: 'Business Development Representative (EU)', d: 'Sales', l: 'Portugal · Remote' },
  { t: 'Partnerships Manager (LATAM)', d: 'Sales', l: 'Brazil · Remote' },
  { t: 'Technical Customer Support (APAC)', d: 'Support', l: 'Kuala Lumpur · Remote' },
  { t: 'Technical Customer Support (EMEA)', d: 'Support', l: 'Egypt · Remote' },
  { t: 'Technical Customer Support (LATAM)', d: 'Support', l: 'Brazil · Remote' },
  { t: 'Customer Success Manager (LATAM)', d: 'Customer Success', l: 'Brazil · Remote' },
  { t: 'Customer Experience Program Manager Associate', d: 'Customer Experience', l: 'Kuala Lumpur' },
  { t: 'Product Manager (AI)', d: 'Product', l: 'Kuala Lumpur' },
  { t: 'Application Security Engineer', d: 'Backend', l: 'Kuala Lumpur' },
  { t: 'Senior DevOps Engineer', d: 'Backend', l: 'Kuala Lumpur' },
  { t: 'Senior Mobile Developer', d: 'Frontend', l: 'Kuala Lumpur' },
  { t: 'Creative Technologist', d: 'Marketing', l: 'Kuala Lumpur' },
  { t: 'Senior Content Writer (CRO)', d: 'Marketing', l: 'Kuala Lumpur' },
  { t: 'Senior Frontend Developer', d: 'Other', l: 'Kuala Lumpur' },
  { t: 'Learning & Development Specialist', d: 'Other', l: 'Kuala Lumpur' }
];
const PREFERRED = ['Sales', 'Support', 'Customer Success', 'Customer Experience', 'Product', 'Backend', 'Frontend', 'Marketing'];
const PILL_BASE = 'appearance: none; cursor: pointer; flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 8px; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 500; line-height: 1; white-space: nowrap;';
const PILL_ON = PILL_BASE + ' border: 1px solid #1B70FF; background: #1B70FF; color: #ffffff;';
const PILL_OFF = PILL_BASE + ' border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #ffffff;';

function departments() {
  const seen = ROLES.map((r) => r.d).filter((d, i, a) => a.indexOf(d) === i);
  const ordered = PREFERRED.filter((d) => seen.indexOf(d) !== -1);
  const extra = seen.filter((d) => PREFERRED.indexOf(d) === -1 && d !== 'Other');
  const list = ordered.concat(extra);
  if (seen.indexOf('Other') !== -1) list.push('Other');
  return list;
}

function vals(sel) {
  var depts = departments();
  var counts = {};
  ROLES.forEach(function (r) { counts[r.d] = (counts[r.d] || 0) + 1; });
  var pills = ['All'].concat(depts).map(function (name) {
    var count = name === 'All' ? ROLES.length : counts[name];
    return { name: name, label: name + ' · ' + count, style: name === sel ? PILL_ON : PILL_OFF, pressed: name === sel ? 'true' : 'false' };
  });
  var groups = depts.filter(function (d) { return sel === 'All' || d === sel; }).map(function (d) {
    return {
      name: d,
      countLabel: counts[d] + (counts[d] === 1 ? ' open role' : ' open roles'),
      roles: ROLES.filter(function (r) { return r.d === d; }).map(function (r) {
        return { title: r.t, meta: r.l + ' · Full-time', href: 'job.html' };
      })
    };
  });
  return { pills: pills, groups: groups, total: ROLES.length };
}

  var sel = 'All';
  function render() {
    var v = vals(sel);
    var pills = v.pills, groups = v.groups, total = v.total;
    document.querySelectorAll('[data-total]').forEach(function (el) { el.textContent = total; });
    document.querySelector('[data-loop="0"]').innerHTML = `${pills.map(function(p){ return `<button type="button" style="${p.style}" aria-pressed="${p.pressed}" data-pick="${p.name}">${p.label}</button>`; }).join('')}`;
    document.querySelector('[data-loop="2"]').innerHTML = `${groups.map(function(g){ return `<div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: baseline; gap: 10px; padding: 0 2px;">
            <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #F8F9FA;">${g.name}</div>
            <div style="font-size: 12px; color: #CDCDCF;">${g.countLabel}</div>
          </div>
          ${g.roles.map(function(r){ return `<a href="${r.href}" class="role" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border: 1px solid #003CA0; border-radius: 20px; text-decoration: none; color: #ffffff;">
              <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
                <div style="font-size: 17px; font-weight: 600; line-height: 24px; color: #ffffff;">${r.title}</div>
                <div style="font-size: 14px; line-height: 20px; font-weight: 400; color: #CDCDCF;">${r.meta}</div>
              </div>
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M4 10h12"></path><path d="M11 5l5 5-5 5"></path></svg>
            </a>`; }).join('')}
        </div>`; }).join('')}`;
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-pick]');
    if (!b) return;
    sel = b.getAttribute('data-pick');
    render();
  });
  render();
})();
</script>
</body>
</html>
